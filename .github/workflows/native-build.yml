name: Native desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64 (.deb)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake file \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcursor-dev libxi-dev libxkbcommon-dev \
            libxrandr-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Run native tests
        run: cargo test --locked --manifest-path native/Cargo.toml

      - name: Build Debian package
        run: ./build-linux.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: SuperPDFStudio-Linux-x86_64
          path: artifacts/SuperPDFStudio_Linux.deb
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x86_64 (.exe)
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM for MuPDF bindgen
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            throw "LLVM installation did not provide libclang.dll at $llvmBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvmBin"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Run native tests
        run: cargo test --locked --manifest-path native/Cargo.toml

      - name: Build Windows executable
        shell: pwsh
        run: .\build-win.ps1

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SuperPDFStudio-Windows-x86_64
          path: artifacts/SuperPDFStudio.exe
          if-no-files-found: error
          retention-days: 30
